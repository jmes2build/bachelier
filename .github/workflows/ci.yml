name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.build }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build: [make, cmake]
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        if: matrix.compiler == 'clang++'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Show compiler version
        run: ${{ matrix.compiler }} --version

      - name: Build and test (make)
        if: matrix.build == 'make'
        run: make test CXX=${{ matrix.compiler }}

      - name: Build and test (cmake)
        if: matrix.build == 'cmake'
        run: |
          cmake -B build -S . -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Driven by the Makefile's `sanitize` target so the source list lives in
      # exactly one place. A hardcoded list here silently went stale once.
      - name: Build and run with sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: make sanitize

  warnings:
    name: warnings as errors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with -Werror
        run: make test CXXFLAGS="-std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude"

  cli:
    name: cli smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: Price, lattice and implied vol all run
        run: |
          set -euo pipefail
          ./build/bin/bachelier price -s 100 -k 100 -t 1 -r 0.05 -v 0.2
          ./build/bin/bachelier tree  -s 90 -k 100 -t 1 -r 0.05 -v 0.2 --put --american --steps 200
          ./build/bin/bachelier iv    -s 100 -k 100 -t 1 -r 0.05 --price 10.450583572185565
      - name: Bad input exits non-zero
        run: |
          if ./build/bin/bachelier price -s -1 -k 100 -t 1 -v 0.2; then
            echo "expected failure on negative spot" >&2
            exit 1
          fi
